name: CI — Security & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create reports dir
        run: mkdir -p reports

      # ----------------------------------------------------------------
      # Bandit — Python SAST
      # Non-blocking: repo has documented accepted-risk findings
      # (B104 bind-all-interfaces, B110 try/except/pass, B112 fallback).
      # Findings are uploaded as artifacts for human review.
      # ----------------------------------------------------------------
      - name: Bandit (Python SAST)
        run: |
          bandit -r . -c bandit.yaml -f json -o reports/bandit-ci.json || true
          bandit -r . -c bandit.yaml -f txt
        continue-on-error: true

      # ----------------------------------------------------------------
      # pip-audit — Dependency CVE scanner
      # Reports CVEs; non-blocking so a scanner outage doesn't fail CI.
      # ----------------------------------------------------------------
      - name: pip-audit (Dependency CVEs)
        run: |
          pip-audit -r requirements.txt --format=json -o reports/pipaudit-ci.json || true
          pip-audit -r requirements.txt || true
        continue-on-error: true

      # ----------------------------------------------------------------
      # Ruff — Linter (BLOCKING)
      # Repo is currently clean; any new violation fails CI.
      # ----------------------------------------------------------------
      - name: Ruff (Linter)
        run: ruff check .

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit-ci.json
          if-no-files-found: warn

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipaudit-report
          path: reports/pipaudit-ci.json
          if-no-files-found: warn

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          pytest tests/ -v --tb=short 2>&1 | tee reports/pytest-ci.txt
        continue-on-error: true

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-ci.txt
          if-no-files-found: warn